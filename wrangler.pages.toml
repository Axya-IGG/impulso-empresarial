# Configuracao do projeto Pages. Nao se chama wrangler.toml de proposito:
# o `pages_build_output_dir` abaixo aponta para uma pasta que so existe no
# diretorio temporario de publicacao, entao um wrangler.toml na raiz do
# repositorio faria qualquer comando wrangler rodado aqui procurar por uma
# pasta inexistente. O deploy.ps1 copia este arquivo para o stage ja com o
# nome wrangler.toml.
#
# Layout que o stage monta e que este arquivo descreve:
#   stage/wrangler.toml
#   stage/public/      -> os arquivos estaticos do site
#   stage/functions/   -> as Pages Functions (a API)

name = "impulso-empresarial"
compatibility_date = "2026-08-28"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "impulso-db"
database_id = "0685aff2-e875-432f-af5b-eeb848c42b73"

[vars]
# Restaurado em 30/09: a API oficial (abaixo) ficou em stand-by — nome de
# exibicao do numero ainda PENDING_REVIEW na Meta — e voltamos a usar so' a
# Evolution pra envio avulso/reenvio manual (functions/api/admin/testar.js
# e reenviar.js). Tirar de novo quando a Meta aprovar o nome.
EVOLUTION_URL = "https://zap.ardassessoria.com.br"
EVOLUTION_INSTANCIA = "axya"
# Pixel ID nao e segredo (fica visivel no HTML de qualquer pagina com o
# Pixel instalado) — so o token da Conversions API abaixo e que e secret.
META_PIXEL_ID = "1478085317261876"
# Numero real (producao) na API oficial do WhatsApp (Cloud API), registrado
# em 28/09 — nao confundir com o numero de teste que a Meta da de brinde.
# So o ID, nao e segredo (equivalente ao META_PIXEL_ID acima); quem autentica
# e o WHATSAPP_ACCESS_TOKEN, esse sim secret.
WHATSAPP_PHONE_NUMBER_ID = "1303927066142421"
WHATSAPP_WABA_ID = "4474965946059660"

# ADMIN_SENHA, SESSION_SECRET, EVOLUTION_APIKEY, EDUZZ_WEBHOOK_SECRET,
# META_CAPI_TOKEN, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET e
# WHATSAPP_ACCESS_TOKEN sao secrets e ficam fora daqui — vars entram no
# repositorio e aparecem no painel da Cloudflare. Definir uma vez com
# (bash, nunca PowerShell — o pipe do PowerShell corrompe o valor gravado):
#   printf '%s' "$valor" | npx wrangler pages secret put ADMIN_SENHA           --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put SESSION_SECRET        --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put EVOLUTION_APIKEY      --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put EDUZZ_WEBHOOK_SECRET  --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put META_CAPI_TOKEN       --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put WHATSAPP_VERIFY_TOKEN --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put WHATSAPP_APP_SECRET   --project-name=impulso-empresarial
#   printf '%s' "$valor" | npx wrangler pages secret put WHATSAPP_ACCESS_TOKEN --project-name=impulso-empresarial
# EDUZZ_WEBHOOK_SECRET valida o header x-signature em functions/api/webhook/eduzz.js
# (hmac-sha256, ver developers.eduzz.com/docs/webhook/security).
# META_CAPI_TOKEN autentica o envio de eventos de servidor pra Meta (Conversions
# API) em functions/api/webhook/eduzz.js — gerado em Gerenciador de Eventos →
# Pixel → Configuracoes → API de Conversoes → Gerar token de acesso.
# WHATSAPP_VERIFY_TOKEN e o segredo combinado no handshake do webhook (GET);
# WHATSAPP_APP_SECRET valida a assinatura x-hub-signature-256 dos eventos
# (POST) — ambos em functions/api/webhook/meta-whatsapp.js. WHATSAPP_ACCESS_TOKEN
# e o token permanente do usuario de sistema (Configuracoes do Negocio →
# Usuarios do sistema → Gerar novo token, com whatsapp_business_messaging e
# whatsapp_business_management), usado por enviarWhatsappMeta e
# enviarWhatsappMetaTexto em functions/_lib.js.

# O preview usa um banco proprio (impulso-db-preview), separado do de
# producao desde 02/10: cadastro feito numa pagina de pre-visualizacao
# entrava como lead real e recebia a regua de WhatsApp do worker, que so' le
# o banco de producao. Os secrets tambem nao chegam aqui (o `wrangler pages
# secret put` grava so em producao), entao o preview nao manda evento pra
# Conversions API do Meta nem abre o painel.
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "impulso-db-preview"
database_id = "60d7d2e5-17ba-4f5d-b02f-420c095dd139"

[env.preview.vars]
EVOLUTION_URL = "https://zap.ardassessoria.com.br"
EVOLUTION_INSTANCIA = "axya"
