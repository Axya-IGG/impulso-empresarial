# Worker separado (não Pages Function) porque só ele precisa de Cron
# Trigger — Pages Functions não roda em agenda, só responde a requisição.
# Compartilha o mesmo banco D1 do site (binding "DB") e reaproveita
# functions/_lib.js do repo principal via import relativo.

name = "impulso-remarketing"
main = "src/index.js"
compatibility_date = "2026-08-28"

[[d1_databases]]
binding = "DB"
database_name = "impulso-db"
database_id = "0685aff2-e875-432f-af5b-eeb848c42b73"

[vars]
# Numero real na API oficial do WhatsApp (Cloud API) — mesmo ID que ja esta
# em wrangler.pages.toml, copiado aqui porque este Worker e' um projeto
# Cloudflare separado, com seu proprio cofre de vars/secrets.
WHATSAPP_PHONE_NUMBER_ID = "1303927066142421"
# Restaurado em 30/09 so' pro disparo emergencial de virada de lote (ver
# rodarEmergencia em src/index.js e o comentario em functions/_lib.js) —
# remover de novo junto com o resto do bloco Evolution depois da campanha.
EVOLUTION_URL = "https://zap.ardassessoria.com.br"
EVOLUTION_INSTANCIA = "axya"

# A cada 5 minutos. MAX_POR_RODADA em src/index.js supõe essa cadência
# (4/rodada * 12 rodadas/hora = 48 mensagens/hora no máximo).
[triggers]
crons = ["*/5 * * * *"]

# ADMIN_SENHA, WHATSAPP_ACCESS_TOKEN e EVOLUTION_APIKEY são secrets e ficam
# fora daqui (mesmo valor já usado pelas Pages Functions — não precisa gerar
# de novo, só copiar):
#   printf '%s' "$valor" | npx wrangler secret put ADMIN_SENHA           --name impulso-remarketing
#   printf '%s' "$valor" | npx wrangler secret put WHATSAPP_ACCESS_TOKEN --name impulso-remarketing
#   printf '%s' "$valor" | npx wrangler secret put EVOLUTION_APIKEY      --name impulso-remarketing
